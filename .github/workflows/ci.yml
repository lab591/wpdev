name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-php:
    name: Plugin PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip, mbstring
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --no-progress
      - name: PHPUnit
        run: composer test
      - name: Lint (syntax + WordPress Coding Standards)
        if: matrix.php == '8.3'
        run: composer lint

  plugin-admin:
    name: Plugin admin app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - name: Lint (types, JS, styles)
        run: npm run lint
      - run: npm run build

  companion:
    name: Companion (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: companion/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End-to-end (WordPress in Docker + companion)
    runs-on: ubuntu-latest
    needs: [plugin-php, companion]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the companion
        working-directory: companion
        run: npm ci && npm run build
      - name: Start WordPress (wp-env)
        working-directory: e2e
        run: npm ci && npx wp-env start
      - name: Scenarios
        working-directory: e2e
        run: npm test
